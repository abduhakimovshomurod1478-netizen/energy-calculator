<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101114;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator {
            width: 100%;
            max-width: 430px;
            background: #191b20;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #999;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #101114;
            color: white;
            font-size: 16px;
            outline: none;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #00a86b;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #008f5b;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            background: #101114;
            text-align: center;
        }

        .result span {
            display: block;
            color: #999;
            margin-bottom: 8px;
        }

        .power {
            font-size: 32px;
            font-weight: bold;
            color: #00d084;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>⚡ Energy Calculator</h1>
    <div class="subtitle">3-phase active power</div>

    <label>Kuchlanish U (V)</label>
    <input id="voltage" type="number" placeholder="Masalan: 400">

    <label>Tok I (A)</label>
    <input id="current" type="number" placeholder="Masalan: 25">

    <label>cos φ</label>
    <input id="cosphi" type="number" step="0.01" placeholder="Masalan: 0.85">

    <button onclick="calculatePower()">Hisoblash</button>

    <div class="result">
        <span>Aktiv quvvat</span>
        <div class="power" id="result">0.00 kW</div>
    </div>

</div>

<script>
function calculatePower() {

    const U = parseFloat(document.getElementById("voltage").value);
    const I = parseFloat(document.getElementById("current").value);
    const cosPhi = parseFloat(document.getElementById("cosphi").value);

    if (isNaN(U) || isNaN(I) || isNaN(cosPhi)) {
        alert("Barcha qiymatlarni kiriting!");
        return;
    }

    const P = Math.sqrt(3) * U * I * cosPhi;

    document.getElementById("result").innerText =
        (P / 1000).toFixed(2) + " kW";
}
</script>

</body>
      </html>
