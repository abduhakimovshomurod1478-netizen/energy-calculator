<html lang="uz">
<head>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #0d1117;
    color: white;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
}

.header {
    text-align: center;

}

.logo {
    font-size: 45px;
}

    margin: 5px 0;

}

    display: block;
    margin: 16px 0 7px;

    font-weight: bold;
}

select,
input {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #30363d;

    outline: none;
}

select:focus,
input:focus {
    border-color: #00d084;
}

button {

    border-radius: 10px;
    background: #00a86b;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

button:active {
    transform: scale(0.98);
}

.results {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    margin-top: 20px;
}

.result {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 18px;
    text-align: center;
}

.result-title {
    color: #8b949e;
    margin-bottom: 8px;
}

.value {
    font-size: 28px;
    font-weight: bold;
}

.unit {
    color: #8b949e;
    font-size: 14px;
}

.formula {
    margin-top: 18px;
    padding: 14px;
    background: #0d1117;
    border-radius: 10px;
    color: #8b949e;
    text-align: center;
    font-size: 14px;
}

    color: #ff7b72;

<body>

<div class="container">

    <div class="header">
        <div class="logo">⚡</div>
        <h1>Energy Calculator</h1>
        <div class="subtitle">Electrical Power Calculator</div>
    </div>

    <div class="card">

        <label>Tizim turi</label>

        <select id="phase">
            <option value="3">3 fazali</option>
            <option value="1">1 fazali</option>
        </select>

        <label>Kuchlanish U (V)</label>
        <input
            id="voltage"
            type="number"
            placeholder="Masalan: 400"
            min="0"
        >

        <label>Tok I (A)</label>
        <input
            id="current"
            type="number"
            placeholder="Masalan: 25"
            min="0"
        >

        <label>cos φ</label>
        <input
            id="cosphi"
            type="number"
            placeholder="Masalan: 0.85"
            min="0"
            max="1"
            step="0.01"
        >

        <button onclick="calculate()">
            ⚡ Hisoblash
        </button>

        <div id="error" class="error">
            Ma'lumotlarni to'g'ri kiriting!
        </div>

    </div>

    <div class="card">

        <h2 style="text-align:center;">Natija</h2>

        <div class="results">

            <div class="result">
                <div class="result-title">
                    S — To‘liq quvvat
                </div>

                <div class="value" id="S">
                    0.00
                </div>

                <div class="unit">
                    kVA
                </div>
            </div>

            <div class="result">
                <div class="result-title">
                    P — Aktiv quvvat
                </div>

                <div class="value" id="P">
                    0.00
                </div>

                <div class="unit">
                    kW
                </div>
            </div>

            <div class="result">
                <div class="result-title">
                    Q — Reaktiv quvvat
                </div>

                <div class="value" id="Q">
                    0.00
                </div>

                <div class="unit">
                    kVAr
                </div>
            </div>

        </div>

        <div id="formula" class="formula">
            Formula natija bilan birga ko‘rsatiladi
        </div>

    </div>

    <div class="footer">
        Energy Calculator • Electrical Engineering Tool
    </div>

</div>

<script>

function calculate() {

    const phase = Number(document.getElementById("phase").value);
    const U = Number(document.getElementById("voltage").value);
    const I = Number(document.getElementById("current").value);
    const cosPhi = Number(document.getElementById("cosphi").value);

    const error = document.getElementById("error");

    if (
        U <= 0 ||
        I <= 0 ||
        cosPhi <= 0 ||
        cosPhi > 1 ||
        !isFinite(U) ||
        !isFinite(I) ||
        !isFinite(cosPhi)
    ) {

        error.style.display = "block";
        return;
    }

    error.style.display = "none";

    let S;

    if (phase === 3) {

        // 3 fazali tizim
        S = Math.sqrt(3) * U * I;

        document.getElementById("formula").innerText =
            "S = √3 × U × I";

    } else {

        // 1 fazali tizim
        S = U * I;

        document.getElementById("formula").innerText =
            "S = U × I";
    }

    // VA → kVA
    S = S / 1000;

    // Aktiv quvvat
    const P = S * cosPhi;

    // Reaktiv quvvat
    const Q = S * Math.sqrt(1 - Math.pow(cosPhi, 2));

    document.getElementById("S").innerText =
        S.toFixed(2);

    document.getElementById("P").innerText =
        P.toFixed(2);

    document.getElementById("Q").innerText =
        Q.toFixed(2);
}

</script>

</body>
